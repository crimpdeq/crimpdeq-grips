name: CI

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

# A newer push cancels the older run of the same ref, so an older commit whose checks finish later
# cannot deploy over a newer one.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint scripts
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Install uv
              uses: astral-sh/setup-uv@v7
            - name: Run ruff
              run: uvx ruff check --line-length 120 scripts

    export:
        name: Export ${{ matrix.grip }} (${{ matrix.hand }} hand)
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                grip: [photon, spark]
                hand: [left, right]
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Install OpenSCAD
              uses: ./.github/actions/setup-openscad
            - name: Export every part
              run: python3 scripts/export.py ${{ matrix.grip }} --hand ${{ matrix.hand }} --out stl
            - name: Check the STLs
              run: python3 scripts/check_stl.py stl/*.stl

    export-one-piece:
        name: Export ${{ matrix.model }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                model: [mico, quark]
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Install OpenSCAD
              uses: ./.github/actions/setup-openscad
            - name: Export the part
              run: python3 scripts/export.py ${{ matrix.model }} --out stl
            - name: Check the STL
              run: python3 scripts/check_stl.py stl/${{ matrix.model }}.stl

    step:
        name: Compare with the STEP files
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  # check_step.py reads the STEP files from history.
                  fetch-depth: 0
            - name: Install OpenSCAD
              uses: ./.github/actions/setup-openscad
            - name: Install uv
              uses: astral-sh/setup-uv@v7
            - name: Run check_step.py
              run: uv run scripts/check_step.py

    book:
        name: Build book
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Install mdBook
              uses: taiki-e/install-action@v2
              with:
                  tool: mdbook
            - name: Download the WebAssembly OpenSCAD of the measuring page
              run: python3 scripts/fetch_openscad_wasm.py
            - name: Build book
              run: mdbook build docs
            - name: Upload the book for deployment
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-artifact@v6
              with:
                  name: book
                  path: docs/book
                  if-no-files-found: error

    # The site serves the models to the measuring page: publish only commits that pass every check.
    deploy:
        name: Deploy book to grips.crimpdeq.com
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [lint, export, export-one-piece, step, book]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            deployments: write
        steps:
            # Wrangler reads the commit and branch of the deployment from the checkout.
            - name: Checkout
              uses: actions/checkout@v6
            - name: Download the book
              uses: actions/download-artifact@v7
              with:
                  name: book
                  path: docs/book
            - name: Publish to Cloudflare Pages
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: 2fc7f8105c4c2a621b320949cae125ae
                  gitHubToken: ${{ secrets.GITHUB_TOKEN }}
                  command: pages deploy docs/book --project-name=crimpdeq-grips
